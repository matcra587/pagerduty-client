name: release

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  release:
    name: GoReleaser
    runs-on: ubuntu-latest
    environment: deploy
    permissions:
      attestations: write       # Required to create GitHub artifact attestations.
      contents: write           # Required to create GitHub releases and upload assets.
      id-token: write           # Required for cosign and GitHub attestations via OIDC.
    steps:
      - name: Checkout
        # clover: provider=auto constraint=minor tags=checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install cosign
        # clover: provider=auto constraint=minor tags=cosign-installer
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Install mise
        # clover: provider=auto constraint=minor tags=mise-action
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          install_args: --locked
          cache: false

      - name: Check release state
        id: release-state
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if gh release view "${TAG_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "exists=true" >>"${GITHUB_OUTPUT}"
            echo "release ${TAG_NAME} already exists; skipping GoReleaser publish"
          else
            echo "exists=false" >>"${GITHUB_OUTPUT}"
          fi

      - name: Run GoReleaser
        if: steps.release-state.outputs.exists != 'true'
        # clover: provider=auto constraint=minor tags=goreleaser-action
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: ~> v2.15
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download release checksums
        if: steps.release-state.outputs.exists == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          mkdir -p dist
          gh release download "${TAG_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern checksums.txt \
            --dir dist \
            --clobber

      - name: Attest release artifact provenance
        if: steps.release-state.outputs.exists != 'true'
        # clover: provider=auto constraint=minor tags=attest
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-checksums: dist/checksums.txt

      - name: Create Homebrew tap token
        id: app-token
        # clover: provider=auto constraint=minor tags=create-github-app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          repositories: homebrew-tap
          permission-contents: write # Required to commit the updated formula to the tap.

      - name: Publish Homebrew formula
        # clover: provider=auto constraint=minor tags=actions
        uses: matcra587/github-actions/packages/homebrew-publish-formula@6e3053f35d4ec31adc4f82c04a2c43209f3b36e6 # homebrew/v0.1.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          tap: matcra587/homebrew-tap
          name: pagerduty-client
          desc: PagerDuty API client and CLI
          homepage: https://github.com/matcra587/pagerduty-client
          version: ${{ github.ref_name }}
          binary-name: pdc
          module-path: github.com/matcra587/pagerduty-client
          build-package: ./cmd/pdc
          commit-message: "pagerduty-client: v{version}"
